<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draft Board — 1.01, 12-Team Half PPR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#D9DDD6;
    --board-dark:#C6CBC2;
    --sticker:#FFFFFF;
    --ink:#16191A;
    --ink-soft:#5C625E;
    --tape:#F2C230;
    --qb:#C2255C;
    --rb:#157F52;
    --wr:#2563A8;
    --te:#B4690E;
    --k:#6D4AA8;
    --def:#6B6256;
    --display:"Barlow Condensed",Impact,sans-serif;
    --body:"Archivo",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--board);
    background-image:
      linear-gradient(rgba(0,0,0,.035) 1px,transparent 1px),
      linear-gradient(90deg,rgba(0,0,0,.035) 1px,transparent 1px);
    background-size:34px 34px;
    color:var(--ink);
    font-family:var(--body);
    font-size:15px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:22px 16px 80px;}

  /* ---------- masthead ---------- */
  .mast{
    border-bottom:3px solid var(--ink);
    padding-bottom:14px;
    margin-bottom:18px;
  }
  .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 0 6px;
  }
  h1{
    font-family:var(--display);
    font-weight:700;
    font-size:clamp(38px,9vw,64px);
    line-height:.92;
    letter-spacing:-.01em;
    text-transform:uppercase;
    margin:0;
  }
  h1 em{
    font-style:normal;
    background:var(--tape);
    padding:0 .18em;
    box-decoration-break:clone;
    -webkit-box-decoration-break:clone;
  }
  .sub{
    font-family:var(--mono);
    font-size:12px;
    color:var(--ink-soft);
    margin:10px 0 0;
  }

  /* ---------- roster strip ---------- */
  .roster{
    position:sticky;top:0;z-index:20;
    background:var(--board);
    border-bottom:2px solid var(--ink);
    margin:0 -16px 26px;
    padding:10px 16px 12px;
  }
  .roster-head{
    display:flex;justify-content:space-between;align-items:baseline;
    gap:12px;margin-bottom:8px;
  }
  .roster-title{
    font-family:var(--mono);font-size:11px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--ink-soft);
  }
  .slots{display:flex;flex-wrap:wrap;gap:5px;}
  .slot{
    font-family:var(--mono);font-size:10.5px;font-weight:500;
    border:1.5px solid var(--board-dark);
    background:transparent;color:var(--ink-soft);
    padding:4px 7px;border-radius:2px;
    letter-spacing:.04em;white-space:nowrap;
  }
  .slot.filled{
    background:var(--ink);border-color:var(--ink);color:var(--board);
  }
  .slot .lbl{opacity:.55;margin-right:5px;}
  .btn-reset{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
    text-transform:uppercase;background:none;border:1.5px solid var(--ink);
    color:var(--ink);padding:4px 10px;border-radius:2px;cursor:pointer;
  }
  .btn-reset:hover{background:var(--ink);color:var(--board);}

  /* ---------- turn block ---------- */
  .turn{margin-bottom:38px;}
  .turn-head{
    display:flex;align-items:flex-start;gap:12px;margin-bottom:4px;
  }
  .picknum{
    font-family:var(--display);font-weight:700;
    font-size:clamp(30px,7vw,44px);line-height:.85;
    background:var(--tape);padding:6px 9px 4px;
    border:2px solid var(--ink);
    box-shadow:3px 3px 0 var(--ink);
    white-space:nowrap;flex-shrink:0;
  }
  .turn-meta{padding-top:3px;}
  .turn-round{
    font-family:var(--mono);font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-soft);
  }
  .turn-plan{
    font-family:var(--display);font-weight:600;
    font-size:clamp(19px,4.4vw,25px);line-height:1.1;
    text-transform:uppercase;margin-top:2px;
  }
  .turn-note{
    font-size:13.5px;color:var(--ink-soft);
    margin:10px 0 14px;max-width:62ch;
  }

  /* ---------- section rules inside a turn ---------- */
  .rule{
    display:flex;align-items:center;gap:10px;
    margin:0 0 9px;
  }
  .rule-lbl{
    font-family:var(--mono);font-size:10.5px;font-weight:600;
    letter-spacing:.16em;text-transform:uppercase;
    white-space:nowrap;
  }
  .rule.take .rule-lbl{
    background:var(--tape);color:var(--ink);
    border:2px solid var(--ink);
    box-shadow:2px 2px 0 var(--ink);
    padding:3px 8px;
  }
  .rule.rest .rule-lbl{color:var(--ink-soft);}
  .rule .line{flex:1;height:0;border-top:2px solid var(--ink);}
  .rule.rest .line{border-top:1px dashed var(--board-dark);}
  .rest-block{margin-top:20px;}

  /* ---------- sticker cards ---------- */
  .cards{
    display:grid;gap:8px;
    grid-template-columns:repeat(auto-fill,minmax(258px,1fr));
  }
  .cards.picks{grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px;}
  .card{
    display:flex;align-items:stretch;gap:0;
    background:var(--sticker);
    border:2px solid var(--ink);
    box-shadow:3px 3px 0 var(--ink);
    border-radius:2px;
    transition:transform .18s ease,box-shadow .18s ease,opacity .18s ease,filter .18s ease;
    overflow:hidden;
  }
  .card.gone{
    transform:rotate(-1.1deg) scale(.982);
    box-shadow:none;opacity:.42;filter:grayscale(1);
  }
  .card.mine{
    box-shadow:3px 3px 0 var(--tape),3px 3px 0 2px var(--ink);
  }
  .card.rec{
    background:#FFFBEC;
    box-shadow:5px 5px 0 var(--ink);
  }
  .card.rec.mine{
    box-shadow:5px 5px 0 var(--tape),5px 5px 0 2px var(--ink);
  }
  .card.rec.gone{box-shadow:none;}
  .tap{
    flex:1;display:flex;align-items:center;gap:9px;
    background:none;border:0;padding:9px 4px 9px 0;
    font-family:inherit;text-align:left;cursor:pointer;color:inherit;
    min-width:0;
  }
  .card.rec .tap{padding:10px 4px 10px 0;align-items:flex-start;}
  .pos{
    font-family:var(--display);font-weight:700;font-size:13px;
    letter-spacing:.06em;color:#fff;
    padding:0 7px;align-self:stretch;
    display:flex;align-items:center;flex-shrink:0;
  }
  .pos.QB{background:var(--qb);} .pos.RB{background:var(--rb);}
  .pos.WR{background:var(--wr);} .pos.TE{background:var(--te);}
  .pos.K{background:var(--k);}   .pos.DEF{background:var(--def);}
  .who{min-width:0;flex:1;}
  .nm{
    font-weight:600;font-size:14px;line-height:1.2;
    display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .card.rec .nm{font-size:15.5px;white-space:normal;}
  .card.gone .nm{text-decoration:line-through;}
  .tm{
    font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);
    letter-spacing:.05em;
  }
  .why{
    display:block;font-size:12.5px;line-height:1.35;
    color:var(--ink);margin-top:4px;
  }
  .card.gone .why{color:var(--ink-soft);}
  .tie{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink);
    background:var(--tape);padding:1px 5px;border:1px solid var(--ink);
    display:inline-block;margin-top:5px;
  }
  .adp{
    font-family:var(--mono);font-size:12px;font-weight:600;
    color:var(--ink-soft);padding-right:8px;align-self:center;flex-shrink:0;
  }
  .card.rec .adp{align-self:flex-start;padding-top:2px;}
  .flag{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--qb);display:block;margin-top:1px;
  }
  .claim{
    font-family:var(--display);font-weight:600;font-size:12px;
    letter-spacing:.09em;text-transform:uppercase;
    background:var(--ink);color:var(--board);
    border:0;border-left:2px solid var(--ink);
    padding:0 11px;cursor:pointer;flex-shrink:0;
  }
  .claim:hover{background:var(--rb);}
  .card.mine .claim{background:var(--tape);color:var(--ink);}
  .tap:focus-visible,.claim:focus-visible,.btn-reset:focus-visible{
    outline:3px solid var(--qb);outline-offset:2px;
  }

  .legend{
    font-family:var(--mono);font-size:11px;color:var(--ink-soft);
    border-top:2px solid var(--ink);padding-top:12px;margin-top:6px;
    display:flex;flex-wrap:wrap;gap:16px;
  }
  @media (prefers-reduced-motion:reduce){
    .card{transition:none;} .card.gone{transform:none;}
  }
  @media (max-width:520px){
    .picknum{font-size:26px;padding:5px 7px 3px;}
    .cards,.cards.picks{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

</div>

      {n:"Dalton Kincaid",t:"BUF",p:"TE",a:"153.8"},
      {n:"Tyler Allgeier",t:"ARI",p:"RB",a:"154.6"},
      {n:"Tank Dell",t:"HOU",p:"WR",a:"155.0"},
      {n:"Isiah Pacheco",t:"DET",p:"RB",a:"156.6"},
      {n:"Chris Rodriguez Jr.",t:"JAX",p:"RB",a:"156.7"}
    ]}
];

const SLOTS = ["QB","RB","RB","WR","WR","TE","FLEX","FLEX","K","DEF","BN","BN","BN","BN","BN"];
const FLEXOK = ["RB","WR","TE"];
const state = { gone:new Set(), mine:[] };

function key(ti,pi){ return ti+"-"+pi; }

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function makeCard(ti,pi,pl){
  const k = key(ti,pi);
  const card = document.createElement("div");
  card.className = "card" + (pl.r ? " rec" : "");
  card.dataset.key = k;

  const tap = document.createElement("button");
  tap.className = "tap";
  tap.setAttribute("aria-pressed","false");
  tap.setAttribute("aria-label","Mark "+pl.n+" as off the board");
  tap.innerHTML =
    '<span class="pos '+pl.p+'">'+pl.p+'</span>'+
    '<span class="who"><span class="nm">'+esc(pl.n)+'</span>'+
    '<span class="tm">'+pl.t+(pl.f?' · <span class="flag" style="display:inline">'+esc(pl.f)+'</span>':'')+'</span>'+
    (pl.w?'<span class="why">'+esc(pl.w)+'</span>':'')+
    (pl.tie?'<span class="tie">'+esc(pl.tie)+'</span>':'')+
    '</span>'+
    '<span class="adp">'+pl.a+'</span>';
  tap.addEventListener("click",()=>toggleGone(k));

  const claim = document.createElement("button");
  claim.className = "claim";
  claim.textContent = "Draft";
  claim.setAttribute("aria-label","Add "+pl.n+" to my roster");
  claim.addEventListener("click",()=>claimPlayer(k,pl));

  card.appendChild(tap);
  card.appendChild(claim);
  return card;
}

function makeRule(cls,label){
  const r = document.createElement("div");
  r.className = "rule " + cls;
  r.innerHTML = '<span class="rule-lbl">'+label+'</span><span class="line"></span>';
  return r;
}

function buildBoard(){
  const board = document.getElementById("board");
  board.innerHTML = "";
  TURNS.forEach((turn,ti)=>{
    const sec = document.createElement("section");
    sec.className = "turn";
    const head = document.createElement("div");
    head.className = "turn-head";
    head.innerHTML =
      '<div class="picknum">'+turn.picks+'</div>'+
      '<div class="turn-meta"><div class="turn-round">'+turn.round+'</div>'+
      '<div class="turn-plan">'+turn.plan+'</div></div>';
    sec.appendChild(head);

    const note = document.createElement("p");
    note.className = "turn-note";
    note.textContent = turn.note;
    sec.appendChild(note);

    const indexed = turn.players.map((pl,pi)=>({pl:pl,pi:pi}));
    const recs = indexed.filter(x=>x.pl.r);
    const rest = indexed.filter(x=>!x.pl.r);

    if(recs.length){
      const n = recs.length;
      sec.appendChild(makeRule("take", n===1 ? "Take this" : "Take these — "+n));
      const g = document.createElement("div");
      g.className = "cards picks";
      recs.forEach(x=>g.appendChild(makeCard(ti,x.pi,x.pl)));
      sec.appendChild(g);
    }

    if(rest.length){
      const block = document.createElement("div");
      block.className = "rest-block";
      block.appendChild(makeRule("rest","If they're gone — everyone else in range"));
      const g = document.createElement("div");
      g.className = "cards";
      rest.forEach(x=>g.appendChild(makeCard(ti,x.pi,x.pl)));
      block.appendChild(g);
      sec.appendChild(block);
    }

    board.appendChild(sec);
  });
}

function toggleGone(k){
  if(state.gone.has(k)){
    state.gone.delete(k);
    state.mine = state.mine.filter(m=>m.k!==k);
  } else {
    state.gone.add(k);
  }
  render();
}

function claimPlayer(k,pl){
  const already = state.mine.find(m=>m.k===k);
  if(already){
    state.mine = state.mine.filter(m=>m.k!==k);
    state.gone.delete(k);
  } else {
    state.gone.add(k);
    state.mine.push({k:k,n:pl.n,p:pl.p});
  }
  render();
}

function assignSlots(){
  const filled = SLOTS.map(s=>({label:s,player:null}));
  const pool = state.mine.slice();
  // exact position first
  pool.forEach(m=>{
    const s = filled.find(f=>f.label===m.p && !f.player);
    if(s){ s.player = m; m.placed = true; } else { m.placed = false; }
  });
  // then flex, then bench
  pool.filter(m=>!m.placed).forEach(m=>{
    let s = null;
    if(FLEXOK.includes(m.p)) s = filled.find(f=>f.label==="FLEX" && !f.player);
    if(!s) s = filled.find(f=>f.label==="BN" && !f.player);
    if(s){ s.player = m; m.placed = true; }
  });
  return filled;
}

function render(){
  document.querySelectorAll(".card").forEach(c=>{
    const k = c.dataset.key;
    const isGone = state.gone.has(k);
    const isMine = state.mine.some(m=>m.k===k);
    c.classList.toggle("gone",isGone && !isMine);
    c.classList.toggle("mine",isMine);
    const tap = c.querySelector(".tap");
    tap.setAttribute("aria-pressed",String(isGone));
    c.querySelector(".claim").textContent = isMine ? "Mine" : "Draft";
  });

  const wrap = document.getElementById("slots");
  wrap.innerHTML = "";
  assignSlots().forEach(f=>{
    const el = document.createElement("span");
    el.className = "slot" + (f.player ? " filled" : "");
    el.innerHTML = '<span class="lbl">'+f.label+'</span>'+(f.player ? f.player.n : "—");
    wrap.appendChild(el);
  });
}

document.getElementById("reset").addEventListener("click",()=>{
  state.gone.clear();
  state.mine = [];
  render();
});

buildBoard();
render();
</script>
</body>
</html>
